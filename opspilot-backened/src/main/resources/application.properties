# Server Configuration
server.port=8080

# Primary Database (H2 with PostgreSQL compatibility for zero-config startup)
spring.datasource.url=jdbc:h2:mem:opspilot;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# External PostgreSQL Configuration (Optional: uncomment if local postgres is running)
# spring.datasource.url=jdbc:postgresql://localhost:5432/opspilot
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Jackson configuration
spring.jackson.serialization.fail-on-empty-beans=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Security
jwt.secret=9a6747f3a778794678926f749f783f34297a3b1c28e019cc4183464188492b4b
jwt.expiration=86400000

# Jev AI Configuration (Inject via environment variable JEV_API_KEY or application-local.properties)
jev.api.url=${JEV_API_URL:https://thejevai.com/v1/systemone}
jev.api.key=${JEV_API_KEY:your_jev_api_key_here}
jev.confidence.threshold=0.70

# Thread Pool for Async Triage Execution
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=OpsPilot-Async-

# Incident Correlation Parameters
opspilot.incident.correlation.threshold=3
opspilot.incident.correlation.window-minutes=30
